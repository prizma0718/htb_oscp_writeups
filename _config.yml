# Site settings
title: HTB OSCP Writeups
description: Penetration testing notes, Active Directory writeups, and security research.
theme: jekyll-theme-slate

# Build settings
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
plugins:
  - jekyll-relative-links
relative_links:
  enabled: true
  collections: true

# DEBUG
defaults:
  - scope:
      path: ""
    values:
      render_with_liquid: false

# Exclude metadata files from the generated site
exclude:
  - README.md
  - LICENSE
  - .gitignore
